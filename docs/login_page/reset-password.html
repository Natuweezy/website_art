<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Khaya — Reset password</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./login_styles.css" />
</head>
<body data-theme="light">
<main class="login-page" aria-label="Reset password">
<div class="login-card" role="form" aria-labelledby="khayaTitle">
<img src="../logos/KH gold.png" alt="Khaya logo" class="login-logo" width="320" height="100" />

<form id="resetForm" class="auth-form" novalidate hidden>
<label class="sr-only" for="resetPassword">New password</label>
<input type="password" id="resetPassword" placeholder="New password" autocomplete="new-password" required minlength="8" />

<label class="sr-only" for="resetPasswordConfirm">Confirm new password</label>
<input type="password" id="resetPasswordConfirm" placeholder="Confirm new password" autocomplete="new-password" required minlength="8" />

<button id="resetBtn" class="auth-submit" type="submit">Set new password</button>
</form>
<p id="reset-status" class="auth-status" role="status" aria-live="polite"></p>
<a id="reset-back-link" class="auth-link" href="./login.html" hidden>Back to login</a>
</div>
</main>

<script defer src="./reset-password.js"></script>
<script defer src="/legal-footer.js"></script>
</body>
</html>
