<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Khaya — Forgot password</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./login_styles.css" />
</head>
<body data-theme="light">
<main class="login-page" aria-label="Forgot password">
<div class="login-card" role="form" aria-labelledby="khayaTitle">
<img src="../logos/KH gold.png" alt="Khaya logo" class="login-logo" width="320" height="100" />

<form id="forgotForm" class="auth-form" novalidate>
<label class="sr-only" for="forgotEmail">Email</label>
<input type="email" id="forgotEmail" placeholder="Email" autocomplete="username" required />

<button id="forgotBtn" class="auth-submit" type="submit">Send reset link</button>
<p id="forgot-status" class="auth-status" role="status" aria-live="polite"></p>
</form>
<p class="auth-note">We'll email you a link to set a new password if that address is registered.</p>
<a class="auth-link" href="./login.html">Back to login</a>
</div>
</main>

<script defer src="./forgot-password.js"></script>
<script defer src="/legal-footer.js"></script>
</body>
</html>
